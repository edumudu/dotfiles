set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# =============================================
# Basic Settings
# =============================================
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
set -g display-panes-time 800             # Slightly longer pane indicators display time
set -g display-time 1000                  # Slightly longer status messages display time
set -g status-interval 10                 # Redraw status line every 10 seconds

set -g monitor-activity on                # Highlight windows with unseen activity
set -g visual-activity off                # Don't show an annoying popup message for it

set -g escape-time 0                       # Faster ESC in Vim/Neovim
set -g mouse on                             # Mouse support

set -sg repeat-time 600       # Increase repeat timeout for repeatable commands
set -s focus-events on        # Let the terminal send focus events to running programs

# =============================================
# Extended Keys (IMPORTANT for Shift+Enter)
# =============================================
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'   # Fix Shift+Enter, Ctrl+arrows, etc.

# =============================================
# Key Bindings
# =============================================

# Better pane splitting
unbind '"'
unbind %

bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -v -c "#{pane_current_path}"

bind - split-window -v -c "#{pane_current_path}" # Split current window horizontally
bind _ split-window -h -c "#{pane_current_path}" # Split current window vertically

bind > swap-pane -D           # Swap current pane with the next one
bind < swap-pane -U           # Swap current pane with the previous one

bind Enter copy-mode          # Faster way to enter copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

bind -r C-h previous-window               # Select previous window
bind -r C-l next-window                   # Select next window
bind Tab last-window                      # Move to last active window

# Clear both screen and history
# bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

bind C-c new-session                      # Create a new session
bind C-f command-prompt -p find-session 'switch-client -t %%' # Find session
bind BTab switch-client -l                # Move to the last session

# --- Smart Pane Switching (Vim Awareness) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Logic: If in Vim, send the key. 
# If NOT in Vim, only move if there is a pane in that direction (prevents wrap).

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}'  '' 'select-pane -R' }

# Resize panels also on vim motions
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Toggle current panel to fullscreen, press it back to return it to the previous size
bind z resize-pane -Z

# Copy mode improvements
setw -g mode-keys vi
# bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Better active pane visualization
set -g pane-border-status top
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'                    # Plugin manager (required)
set -g @plugin 'tmux-plugins/tmux-sensible'          # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'              # Better copying to system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'         # Save & restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'catppuccin/tmux'                     # Beautiful modern theme (very popular in 2026)
set -g @plugin 'tmux-plugins/tmux-continuum'         # Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-cpu'

# Optional but very useful
# set -g @plugin 'christoomey/vim-tmux-navigator'    # Seamless Vim/Neovim + tmux navigation

set -g @continuum-restore 'on'

set -g @resurrect-strategy-nvim 'session'

# Catppuccin settings
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Need to be configured after the catppuccin plugin loads
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

run '~/.tmux/plugins/tpm/tpm'

